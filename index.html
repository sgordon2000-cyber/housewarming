/* ---------- Envelope intro ---------- */
#intro{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding-top:14vh;
  background:transparent;transition:opacity .9s ease .1s,visibility 0s 1s}
#intro.done{opacity:0;visibility:hidden;pointer-events:none}
.stage{text-align:center}
.hint{margin-top:3.2rem;color:var(--red);font-size:.9rem;font-weight:600;transition:opacity .4s}
.opened .hint{opacity:0}
.env{position:relative;width:min(84vw,380px);aspect-ratio:4/3;margin:0 auto;perspective:1200px;filter:drop-shadow(0 14px 18px #0004)}
.env>*{position:absolute}
.back{inset:0;background-color:#1b3f80;background-image:var(--blue-tex);border-radius:5px}
.mini{left:14%;right:14%;top:2%;height:96%;z-index:2;background-color:#cba07a;
  box-shadow:0 2px 10px #0004;transition:transform 1.1s cubic-bezier(.3,.7,.2,1) .65s}
.mini svg{width:100%;height:100%;display:block}
.front{inset:0;background-color:var(--blue);background-image:var(--blue-tex);z-index:3;border-radius:5px;clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%)}
.flap{left:0;right:0;top:0;height:54%;background-color:#3a6bbb;background-image:var(--blue-tex);z-index:4;clip-path:polygon(0 0,100% 0,50% 100%);
  transform-origin:top;transition:transform .7s ease,z-index 0s .35s}
.opened .flap{transform:rotateX(180deg);z-index:1}
.opened .mini{transform:translateY(-66%) scale(1.04)}
.seal{left:50%;top:54%;width:62px;height:62px;margin:-31px 0 0 -31px;z-index:6;border:3px solid var(--cream);border-radius:50%;padding:0;overflow:hidden;
  background:var(--blue);cursor:pointer;box-shadow:0 3px 8px #0006;transition:opacity .3s,transform .3s;animation:pulse 2s ease-in-out infinite}
.seal svg{width:100%;height:100%;display:block}
.seal:hover{transform:scale(1.08)}
.opened .seal{opacity:0;pointer-events:none;animation:none}
@keyframes pulse{50%{box-shadow:0 3px 8px #0006,0 0 0 12px #c8202f44}}

/* ---------- Invite ---------- */
main{max-width:560px;margin:0 auto;padding:clamp(1rem,4vw,2.5rem) 1rem 3.5rem;opacity:0;transform:translateY(24px);transition:opacity 1s .5s,transform 1s .5s}
body.revealed main{opacity:1;transform:none}
.sheet{background:#cba07a;box-shadow:0 14px 40px #0005}
.art{width:100%;display:block}
.details{padding:0 1.4rem 2.6rem;text-align:center;color:var(--red)}
.details h2{font-weight:400;font-size:1.7rem;line-height:1.2;margin-bottom:.9rem}
.details p{font-size:.95rem;line-height:1.8;color:var(--ink)}
.details p strong{font-weight:600;color:var(--red)}
.details a{color:var(--blue-d);font-weight:600}
.btn{display:inline-block;font:600 .8rem var(--font);letter-spacing:.16em;text-transform:uppercase;padding:.9rem 1.5rem;border:2px solid var(--red);
  background:var(--red);color:var(--cream);cursor:pointer;text-decoration:none;transition:transform .15s,background .15s}
.btn:hover{transform:translateY(-1px);background:#a8161f}
.btn.ghost{background:none;color:var(--red)} .btn.ghost:hover{background:#c8202f18}
hr{border:0;height:1.5px;background:var(--red);opacity:.45;margin:2.2rem auto;width:40%}
form{text-align:left;display:grid;gap:1.1rem;max-width:380px;margin:1.4rem auto 0}
label,legend{font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;font-weight:600;display:block;margin-bottom:.35rem;color:var(--red)}
input[type=text],input[type=number],textarea{width:100%;font:400 1rem var(--font);padding:.75rem .85rem;border:1.5px solid var(--red);border-radius:0;
  background:#f6e6cc66;color:var(--ink)}
input:focus,textarea:focus{outline:3px solid var(--blue);outline-offset:1px}
fieldset{border:0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem}
fieldset legend{grid-column:1/-1}
fieldset label{margin:0;font-size:.8rem}
fieldset input{position:absolute;opacity:0}
fieldset span{display:block;text-align:center;padding:.7rem .3rem;border:1.5px solid var(--red);color:var(--red);cursor:pointer}
fieldset input:checked+span{background:var(--red);color:var(--cream)}
fieldset input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
form .btn{justify-self:center;margin-top:.4rem}
#thanks{display:none;font-size:1.25rem;font-weight:400;margin-top:1.4rem;line-height:1.5;color:var(--red)}
.hp{position:absolute;left:-9999px}

@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition-duration:.01s!important;transition-delay:0s!important}
}

<!-- Invitation -->
<main>
  <div class="sheet">
  <svg class="art" viewBox="0 0 1024 1024" role="img" aria-label="Seth and Wanjie are having a housewarming on October 23rd at 7:30 pm"><use href="#art"/></svg>

  <section class="details">
    <h2 class="up">Friday, October 23rd</h2>
    <p class="up">
      <strong>7:30 pm</strong><br>
      500 W 122nd St, Apt 6A<br>
      New York, NY
    </p>
    <p class="up" style="margin-top:1.1rem">Join us in bringing warmth and joy to our new home!<br>Gifts, alcohol, and plus ones all welcome.<br>Let's drink and be merry!</p>

    <hr>
    <button class="btn ghost" id="ics" type="button">Add to calendar</button>

    <hr>
    <h2 class="up">Will you join us?</h2>
    <form id="rsvp" novalidate>
      <input class="hp" type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true">
      <div><label for="name">Your name</label><input type="text" id="name" name="name" required autocomplete="name"></div>
      <fieldset>
        <legend>Attending?</legend>
        <label><input type="radio" name="attending" value="Yes" checked><span>Yes!</span></label>
        <label><input type="radio" name="attending" value="Maybe"><span>Maybe</span></label>
        <label><input type="radio" name="attending" value="No"><span>Can't</span></label>
      </fieldset>
      <div><label for="count">Guests (including you)</label><input type="number" id="count" name="guests" min="1" max="6" value="1"></div>
      <button class="btn" type="submit">Send RSVP</button>
    </form>
    <p id="thanks" class="up" role="status"></p>
  </section>
  </div>
</main>

<script>
/* ================= EDIT THESE ================= */
const CONFIG = {
  hostName: "Seth & Wanjie",
  title:    "Housewarming",
  address:  "500 W 122nd St, Apt 6A, New York, NY",
  start:    "20261023T193000",   // local time, YYYYMMDDTHHMMSS
  end:      "20261023T233000",
  email:    "sgordon51400@gmail.com",
  // RSVPs are emailed to the address above via FormSubmit (no account needed).
  // First time only: submit a test RSVP and click the activation link FormSubmit emails you.
  formEndpoint: "https://formsubmit.co/ajax/sgordon51400@gmail.com"
};
/* ============================================== */

const $ = id => document.getElementById(id);

// Envelope opening
let opened = false;
function openCard(){
  if(opened) return; opened = true;
  $('intro').classList.add('opened');
  setTimeout(()=>{ $('intro').classList.add('done'); document.body.classList.add('revealed'); window.scrollTo(0,0); }, 2300);
}
$('seal').addEventListener('click', openCard);
$('env').addEventListener('click', openCard);

// Add to calendar (.ics download)
$('ics').addEventListener('click', ()=>{
  const ics = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Housewarming//EN","BEGIN:VEVENT",
    "UID:housewarming-"+CONFIG.start+"@invite","DTSTAMP:"+CONFIG.start,
    "DTSTART:"+CONFIG.start,"DTEND:"+CONFIG.end,
    "SUMMARY:"+CONFIG.title+" at "+CONFIG.hostName+"'s","LOCATION:"+CONFIG.address.replace(/,/g,"\\,"),
    "END:VEVENT","END:VCALENDAR"].join("\r\n");
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  a.download = 'housewarming.ics'; a.click();
});

// RSVP
$('rsvp').addEventListener('submit', async e=>{
  e.preventDefault();
  const f = e.target, d = Object.fromEntries(new FormData(f)), n = (d.name||'').trim();
  if(!n){ $('name').focus(); return; }
  const thanks = msg => { f.style.display='none'; const t=$('thanks'); t.textContent=msg; t.style.display='block'; };
  const ok = d.attending==='Yes' ? "Yay! We'll see you there, "+n+"." :
             d.attending==='Maybe' ? "Thanks, "+n+"! Hope you can make it." :
             "We'll miss you, "+n+"! Thanks for letting us know.";
  try{
    const r = await fetch(CONFIG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},
      body:JSON.stringify({...d,_subject:`RSVP: ${n} (${d.attending})`,_template:'table'})});
    if(r.ok) return thanks(ok);
  }catch(_){}
  // Fallback: open the guest's email app
  const body = `Name: ${n}\nAttending: ${d.attending}\nGuests: ${d.guests}`;
  location.href = `mailto:${CONFIG.email}?subject=${encodeURIComponent('RSVP: '+n+' ('+d.attending+')')}&body=${encodeURIComponent(body)}`;
  thanks(ok);
});
</script>
